name: Crawl WAICO news

on:
  schedule:
    # Every 6 hours (times are UTC). Edit to change how often it runs.
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Search as far back as the sources allow"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: waico-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Crawl
        env:
          TRACKER_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python crawler.py --backfill
          else
            python crawler.py
          fi

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update WAICO tracker $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

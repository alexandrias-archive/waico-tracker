# WAICO tracker settings
# Edit this file to change what gets searched and how articles are sorted.
# Changes to categories apply to the whole archive on the next run.

# --- What counts as "about WAICO" -------------------------------------------
# An article that names one of these in its headline is marked "headline".
# Same matching rules as the category keywords further down
# (so "WAICO" must be in capitals and "Waico" does not count).
match_terms:
  - WAICO
  - World AI Cooperation Organization
  - World AI Cooperation Organisation
  - World Artificial Intelligence Cooperation Organization
  - World Artificial Intelligence Cooperation Organisation
  - 世界人工智能合作组织
  - 世界人工智能合作組織
  - 世界AI合作组织
  - 世界人工智能合作組织

# Search engines sometimes return articles that only name WAICO deep in the
# text, or not at all. Those are kept only if the headline or snippet mentions
# AI in some language. This drops unrelated "Waico" companies and similar.
context_terms:
  - AI
  - A.I.
  - artificial intelligence
  - 人工智能
  - 智能
  - ИИ
  - искусственн*
  - IA
  - inteligencia artificial
  - intelligence artificielle
  - inteligência artificial
  - الذكاء الاصطناعي

# Drop any article whose headline or snippet contains one of these
# (useful if "WAICO" turns out to clash with an unrelated company).
exclude_terms: []

# How many days back each scheduled run searches. The first run (or a manual
# run with "backfill" ticked) searches as far back as the sources allow.
lookback_days: 7

# --- Where to search ----------------------------------------------------------
searches:
  # Google News. "edition" picks the country/language edition of Google News.
  google_news:
    - query: '"World AI Cooperation Organization" OR "World Artificial Intelligence Cooperation Organization" OR WAICO'
      edition: en-US
    - query: '"World AI Cooperation Organisation" OR "World Artificial Intelligence Cooperation Organisation" OR WAICO'
      edition: en-GB
    - query: 'WAICO OR "World AI Cooperation Organization" OR "World Artificial Intelligence Cooperation Organisation"'
      edition: en-KE
    - query: 'WAICO OR "World AI Cooperation Organization" OR "World Artificial Intelligence Cooperation Organization"'
      edition: en-NG
    - query: '世界人工智能合作组织'
      edition: zh-CN
    - query: '世界人工智能合作組織 OR 世界人工智能合作组织'
      edition: zh-TW
    - query: '世界人工智能合作組織 OR 世界人工智能合作组织'
      edition: zh-HK

  # Bing News, as a second engine. "market" works like Google's edition.
  bing_news:
    - query: '"World AI Cooperation Organization" OR WAICO'
      market: en-US
    - query: '世界人工智能合作组织'
      market: zh-CN

  # GDELT, an open database of world news in 65 languages. It translates
  # non-English coverage, so one English query also catches Chinese,
  # Russian, Spanish, French and Arabic articles.
  gdelt:
    - query: '("World Artificial Intelligence Cooperation Organization" OR "World AI Cooperation Organization" OR WAICO)'

# --- Categories ---------------------------------------------------------------
# An article gets every category whose keywords appear in its headline or
# snippet. The category with the most hits is its main one. Articles with no
# hits go under "Other".
#
# Keyword rules:
#   - Chinese keywords match anywhere in the text.
#   - English keywords match whole words. Put * at the end to match the start
#     of a word: ratif* matches ratify, ratified, ratification.
#   - Short all-capital terms (US, EU, UN, WAIC, WAICO) only match in
#     capitals, so "US" does not match "us".
